[package]
name = "strata-mdt"
version = "0.1.0"
description = "StrataMDT desktop app"
edition = "2021"

[lib]
name = "strata_mdt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# generate_context!() embeds the plugin config as JSON
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# small, fast binary
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
